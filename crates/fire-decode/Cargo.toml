[package]
name = "fire-decode"
# No `version`: the crate's version is set only in ../../product.json, which build.rs reads into
# `fire_decode::VERSION`. Cargo's own stays 0.0.0, and nothing should read it.
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[features]
# No default features (FD13): each app names what it uses. `psd` and `heif` need the native code in
# `psd-sdk-sys` / `heif-sys`, so CI can still lint and test the pure-Rust core on its own. Turning
# one off does not re-route those formats; it makes them `DecodeError::Unsupported`.
default = []
psd = ["dep:psd-sdk-sys"]
heif = ["dep:heif-sys"]
# ICC and nclx colour conversion through lcms2. Without it `DecodeOptions::honor_icc` does not
# exist; the profile bytes still come back in `DecodedImage::icc`.
icc = ["dep:lcms2", "dep:lcms2-sys"]
# Camera raw, from its embedded JPEG preview.
raw = []
# The mip-chain builder fire and 3D Review upload textures with (FD11, `fire_decode::mips`).
mips = []
# Accept `panic = "abort"`, under which the crate's panic guard does nothing (FD7).
allow-abort = []

[dependencies]
zune-image.workspace = true
zune-core.workspace = true
zune-jpeg.workspace = true
zune-bmp.workspace = true
zune-ppm.workspace = true
zune-farbfeld.workspace = true
jxl-oxide.workspace = true
qoi.workspace = true
libwebp-sys.workspace = true
image-webp.workspace = true
image.workspace = true
tiff.workspace = true
exr.workspace = true
ddsfile.workspace = true
bcdec_rs.workspace = true
lcms2 = { workspace = true, optional = true }
psd-sdk-sys = { workspace = true, optional = true }
heif-sys = { workspace = true, optional = true }
bytemuck.workspace = true
miniz_oxide.workspace = true
# Pinned only (the workspace Cargo.toml says why): named to fix their versions, never called.
png.workspace = true
fdeflate.workspace = true
gif.workspace = true
weezl.workspace = true
moxcms.workspace = true
pxfm.workspace = true
fax.workspace = true
zune-inflate.workspace = true
zune-qoi.workspace = true
jxl-bitstream.workspace = true
jxl-coding.workspace = true
jxl-color.workspace = true
jxl-frame.workspace = true
jxl-grid.workspace = true
jxl-image.workspace = true
jxl-jbr.workspace = true
jxl-modular.workspace = true
jxl-oxide-common.workspace = true
jxl-render.workspace = true
jxl-threadpool.workspace = true
jxl-vardct.workspace = true
lcms2-sys = { workspace = true, optional = true }

[dev-dependencies]
serde_json.workspace = true

# build.rs reads product.json (the version), at build time only.
[build-dependencies]
serde_json.workspace = true

[lints]
workspace = true
