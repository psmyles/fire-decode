[package]
name = "fire-decode"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
repository.workspace = true

[features]
# No default features (FD13): each app names what it uses. `psd` and `heif` need the native code in
# `psd-sdk-sys` / `heif-sys`, so CI can still lint and test the pure-Rust core on its own. Turning
# one off does not re-route those formats; it makes them a clear error (see `decode_psd`).
default = []
psd = ["dep:psd-sdk-sys"]
heif = ["dep:heif-sys"]

[dependencies]
zune-image.workspace = true
zune-core.workspace = true
zune-jpeg.workspace = true
zune-bmp.workspace = true
zune-ppm.workspace = true
zune-farbfeld.workspace = true
jxl-oxide.workspace = true
qoi.workspace = true
libwebp-sys.workspace = true
image-webp.workspace = true
image.workspace = true
tiff.workspace = true
exr.workspace = true
ddsfile.workspace = true
bcdec_rs.workspace = true
lcms2.workspace = true
psd-sdk-sys = { workspace = true, optional = true }
heif-sys = { workspace = true, optional = true }
bytemuck.workspace = true
miniz_oxide.workspace = true

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true
