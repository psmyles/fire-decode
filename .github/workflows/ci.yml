# Correctness only (FD13). Performance is gated locally, before each tag (docs/baselines.md).
#
# FD13's four feature sets: viewer (psd heif icc raw mips), texture (psd heif mips), thumbnail
# (psd heif) and core (none).
#
# Two jobs, the two vendored targets (crates/heif-sys/vendor/VENDOR.txt): macOS arm64 and Windows
# x64. Windows builds with the static CRT (FD20) through the job's own RUSTFLAGS, not a
# .cargo/config.toml: the macOS job's last step needs a Windows check *without* crt-static.
name: CI

on:
  push:
  pull_request:

jobs:
  # A release tag must be product.json's version, the one place it's set (scripts/release.sh tags
  # from it; this catches a tag made by hand).
  tag:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: The tag is v + product.json's version
        run: |
          version=$(python3 -c 'import json; print(json.load(open("product.json"))["version"])')
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME, but product.json's version is $version"; exit 1
          fi

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml pins the toolchain; this installs it with its components and targets.
      - name: Toolchain
        run: rustup toolchain install

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy, core
        run: cargo clippy --workspace --all-targets --locked

      - name: Clippy, thumbnail (psd heif)
        run: cargo clippy --workspace --all-targets --locked --features fire-decode/psd,fire-decode/heif

      - name: Clippy, texture (psd heif mips)
        run: cargo clippy --workspace --all-targets --locked --features fire-decode/psd,fire-decode/heif,fire-decode/mips

      - name: Clippy, viewer (psd heif icc raw mips)
        run: cargo clippy --workspace --all-targets --locked --features fire-decode/psd,fire-decode/heif,fire-decode/icc,fire-decode/raw,fire-decode/mips

      - name: Test, core
        run: cargo test -p fire-decode --locked

      - name: Test, psd
        run: cargo test -p fire-decode --locked --features psd

      - name: Test, thumbnail (psd heif)
        run: cargo test -p fire-decode --locked --features psd,heif

      - name: Test, texture (psd heif mips)
        run: cargo test -p fire-decode --locked --features psd,heif,mips

      - name: Test, viewer (psd heif icc raw mips)
        run: cargo test -p fire-decode --locked --features psd,heif,icc,raw,mips

      # The merged PSD bridge's own suites (FD3). real_psd skips here: its PSD is in 3D Review.
      - name: Test, psd-sdk-sys
        run: cargo test -p psd-sdk-sys --locked

      # FD13: heif on Windows without the static CRT must stop at heif-sys's named error, not deep
      # in a mixed-CRT link. Checked from here by cross-checking for the MSVC target.
      - name: heif without crt-static on Windows is a named error
        shell: bash
        run: |
          if cargo check -p heif-sys --locked --target x86_64-pc-windows-msvc 2> check.log; then
            echo "heif-sys built for Windows without crt-static"; exit 1
          fi
          grep -q "heif-sys needs the static CRT on Windows" check.log

  windows:
    runs-on: windows-latest
    env:
      # FD20: heif-sys's libraries are /MT, so everything links the static CRT. Only this job sees
      # it (see the top of this file).
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: rustup toolchain install

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy, core
        run: cargo clippy --workspace --all-targets --locked

      - name: Clippy, thumbnail (psd heif)
        run: cargo clippy --workspace --all-targets --locked --features fire-decode/psd,fire-decode/heif

      - name: Clippy, texture (psd heif mips)
        run: cargo clippy --workspace --all-targets --locked --features fire-decode/psd,fire-decode/heif,fire-decode/mips

      - name: Clippy, viewer (psd heif icc raw mips)
        run: cargo clippy --workspace --all-targets --locked --features fire-decode/psd,fire-decode/heif,fire-decode/icc,fire-decode/raw,fire-decode/mips

      - name: Test, core
        run: cargo test -p fire-decode --locked

      - name: Test, psd
        run: cargo test -p fire-decode --locked --features psd

      - name: Test, thumbnail (psd heif)
        run: cargo test -p fire-decode --locked --features psd,heif

      - name: Test, texture (psd heif mips)
        run: cargo test -p fire-decode --locked --features psd,heif,mips

      - name: Test, viewer (psd heif icc raw mips)
        run: cargo test -p fire-decode --locked --features psd,heif,icc,raw,mips

      - name: Test, psd-sdk-sys
        run: cargo test -p psd-sdk-sys --locked
